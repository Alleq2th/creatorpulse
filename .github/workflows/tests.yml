name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Parse frontend scripts
        run: |
          set -e
          find public -name '*.js' -not -path 'public/vendor/*' -print0 | while IFS= read -r -d '' f; do
            node --check "$f" || { echo "Syntax error in $f"; exit 1; }
          done
      - name: Run unit tests
        run: npm test
